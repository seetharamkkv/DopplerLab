[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traj-reconstruction"
version = "0.8.0"
description = "Observer-centered trajectory orbit recovery from simulated DopplerSim Phase 1 audio (sim only)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.7",
]
web = [
    "flask>=3.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "PyWavelets>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
